# The launcher and the Godot export are served from the same origin.
# Unversioned build names must revalidate after every deployment.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Permissions-Policy = "xr-spatial-tracking=(self), fullscreen=(self), autoplay=(self), gamepad=(self)"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/exports/local/web/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/exports/local/web/*.pck"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/exports/local/web/*.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/exports/local/web/*.html"
  [headers.values]
    Cache-Control = "no-cache"
